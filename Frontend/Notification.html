<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Send notifications through Teams, Email, and Slack."
  >

  <title>Notify · Send Notification</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./Notification.css">

  <style>
    .sidebar-toggle {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .layout > .sidebar {
      width: 250px;
      flex: 0 0 250px;
      min-width: 0;
      overflow: hidden;
      transition:
        width 0.25s ease,
        flex-basis 0.25s ease,
        padding 0.25s ease;
    }

    .layout > main {
      width: auto;
      min-width: 0;
      flex: 1;
    }

    .sidebar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .sidebar-heading .sidebar-label {
      padding: 0;
      margin: 0;
      white-space: nowrap;
    }

    .sidebar-icon-button {
      display: inline-flex;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
    }

    .sidebar-icon-button:hover {
      color: var(--primary-hover);
    }

    .sidebar-icon-button svg,
    .nav-icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-icon-button svg {
      width: 18px;
      height: 18px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .sign-out-button {
      width: 100%;
      padding: 10px 12px;
      overflow: hidden;
      color: #b91c1c;
      background: transparent;
      border: 1px solid #fecaca;
      border-radius: 7px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .sign-out-button:hover {
      color: white;
      background: #b91c1c;
      border-color: #b91c1c;
    }

    #sidebar-toggle:checked ~ .layout > .sidebar {
      width: 54px;
      flex-basis: 54px;
      padding-right: 15px;
      padding-left: 15px;
    }

    #sidebar-toggle:checked ~ .layout .sidebar-label,
    #sidebar-toggle:checked ~ .layout .sidebar-nav,
    #sidebar-toggle:checked ~ .layout .sidebar-footer {
      display: none;
    }

    #sidebar-toggle:checked ~ .layout .sidebar-heading {
      justify-content: center;
      margin-bottom: 0;
    }

    @media (max-width: 700px) {
      .layout {
        flex-direction: row;
      }

      .layout > .sidebar {
        width: 220px;
        flex-basis: 220px;
      }

      #sidebar-toggle:checked ~ .layout > .sidebar {
        display: flex;
        width: 54px;
        flex-basis: 54px;
      }
    }
  </style>
</head>

<body>
  <input
    type="checkbox"
    id="sidebar-toggle"
    class="sidebar-toggle"
  >

  <div class="layout">
    <aside class="sidebar">
      <div>
        <div class="sidebar-heading">
          <p class="sidebar-label">NOTIFY</p>

          <label
            for="sidebar-toggle"
            class="sidebar-icon-button"
            aria-label="Toggle sidebar"
            title="Toggle sidebar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="2"
              ></rect>

              <path d="M9 3v18"></path>
            </svg>
          </label>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="Dashboard.html">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="3"
                width="7"
                height="7"
                rx="1"
              ></rect>

              <rect
                x="14"
                y="3"
                width="7"
                height="7"
                rx="1"
              ></rect>

              <rect
                x="3"
                y="14"
                width="7"
                height="7"
                rx="1"
              ></rect>

              <rect
                x="14"
                y="14"
                width="7"
                height="7"
                rx="1"
              ></rect>
            </svg>

            <span>Dashboard</span>
          </a>

          <a
            href="Notification.html"
            class="active"
            aria-current="page"
          >
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
              ></path>

              <path d="M10 21h4"></path>
            </svg>

            <span>Send Notification</span>
          </a>

          <a href="History.html">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7"></path>
              <path d="M3 4v5h5"></path>
              <path d="M12 7v5l3 2"></path>
            </svg>

            <span>History</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <button
          type="button"
          id="sign-out-button"
          class="sign-out-button"
          aria-label="Sign out"
          title="Sign out"
        >
          <span id="username-display">Account</span>
        </button>
      </div>
    </aside>

    <main>
      <div class="content">
        <h1>Send a notification</h1>

        <p class="subtitle">
          Compose your message and choose where you want to send it.
        </p>

        <form
          class="card"
          id="notification-form"
          novalidate
        >
          <h2>Notification details</h2>

          <div class="form-group">
            <label class="field-label" for="subject">
              Title or subject
            </label>

            <input
              id="subject"
              name="subject"
              type="text"
              placeholder="For example: Job completed"
              required
            >
          </div>

          <div class="form-group">
            <label class="field-label" for="message">
              Message
            </label>

            <textarea
              id="message"
              name="message"
              placeholder="Write your notification message"
              required
            ></textarea>
          </div>

          <fieldset>
            <legend>Select channels</legend>

            <div class="channels">
              <label class="channel">
                <input
                  type="checkbox"
                  name="channels"
                  value="teams"
                  data-channel-toggle="teams"
                >

                <span>Teams</span>
              </label>

              <label class="channel">
                <input
                  type="checkbox"
                  name="channels"
                  value="email"
                  data-channel-toggle="email"
                >

                <span>Email</span>
              </label>

              <label class="channel">
                <input
                  type="checkbox"
                  name="channels"
                  value="slack"
                  data-channel-toggle="slack"
                >

                <span>Slack</span>
              </label>
            </div>
          </fieldset>

          <div
            class="form-group channel-destination"
            data-channel-fields="teams"
            hidden
          >
            <label
              class="field-label"
              for="teams-destination"
            >
              Teams destination
            </label>

            <input
              id="teams-destination"
              type="text"
              placeholder="ops-channel or teammate@example.com"
            >
          </div>

          <div
            class="form-group channel-destination"
            data-channel-fields="email"
            hidden
          >
            <label
              class="field-label"
              for="email-destination"
            >
              Email recipient
            </label>

            <input
              id="email-destination"
              type="email"
              placeholder="teammate@example.com"
            >
          </div>

          <div
            class="form-group channel-destination"
            data-channel-fields="slack"
            hidden
          >
            <label
              class="field-label"
              for="slack-destination"
            >
              Slack destination
            </label>

            <input
              id="slack-destination"
              type="text"
              placeholder="#engineering or teammate@example.com"
            >
          </div>

          <div
            id="form-status"
            class="form-status"
            role="status"
            aria-live="polite"
          ></div>

          <div class="form-footer">
            <p class="hint">
              Select at least one destination before sending.
            </p>

            <button
              type="submit"
              class="send-button"
            >
              Send notification
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./common.js"></script>
  <script src="./send-notification.js"></script>

  <script>
    const signOutButton =
      document.querySelector("#sign-out-button");

    const usernameDisplay =
      document.querySelector("#username-display");

    const savedUsername =
      localStorage.getItem("notify_username");

    usernameDisplay.textContent =
      savedUsername || "Account";

    signOutButton.addEventListener("click", () => {
      localStorage.removeItem("notify_username");
      localStorage.removeItem("notify_email");

      window.location.href = "Login.html";
    });
  </script>
</body>
</html>
