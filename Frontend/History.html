<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="View and filter notification delivery history."
  >

  <title>Notify · History</title>

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./History.css">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .sidebar-toggle {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .layout {
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 0;
    }

    .layout > .sidebar {
      position: relative;
      z-index: 10;
      display: flex;
      box-sizing: border-box;
      width: 250px;
      height: 100vh;
      min-width: 0;
      flex: 0 0 250px;
      flex-direction: column;
      overflow: visible;
      background: white;
      border-right: 1px solid #e2e8f0;
      transition:
        width 0.25s ease,
        flex-basis 0.25s ease,
        padding 0.25s ease;
    }

    .layout > main {
      width: auto;
      height: 100vh;
      min-width: 0;
      flex: 1;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .sidebar-heading .sidebar-label {
      padding: 0;
      margin: 0;
      white-space: nowrap;
    }

    .sidebar-icon-button {
      display: inline-flex;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
    }

    .sidebar-icon-button:hover {
      color: var(--primary-hover);
    }

    .sidebar-icon-button svg,
    .nav-icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-icon-button svg {
      width: 18px;
      height: 18px;
    }

    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Account control */

    .sidebar-footer {
      position: relative;
      margin-top: auto;
      margin-bottom: 30px;
      padding: 16px 0;
    }

    .account-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 8px;
      overflow: hidden;
      color: #334155;
      background: transparent;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }

    .account-button:hover {
      color: var(--primary);
      background: #f0fdfa;
    }

    .account-icon {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      color: white;
      background: #0f766e;
      border-radius: 50%;
    }

    .account-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .account-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Sign-out popup */

    .account-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      left: 0;
      z-index: 30;
      padding: 8px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgb(15 23 42 / 18%);
    }

    .account-menu[hidden] {
      display: none;
    }

    .popup-signout-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      color: #b91c1c;
      background: transparent;
      border: 0;
      border-radius: 7px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .popup-signout-button:hover {
      color: white;
      background: #b91c1c;
    }

    .popup-signout-button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Collapsed sidebar */

    #sidebar-toggle:checked ~ .layout > .sidebar {
      width: 54px;
      flex-basis: 54px;
      padding-right: 5px;
      padding-left: 5px;
    }

    #sidebar-toggle:checked ~ .layout .sidebar-label,
    #sidebar-toggle:checked ~ .layout .sidebar-nav {
      display: none;
    }

    #sidebar-toggle:checked ~ .layout .sidebar-heading {
      justify-content: center;
      margin-bottom: 0;
    }

    #sidebar-toggle:checked ~ .layout .account-name {
      display: none;
    }

    #sidebar-toggle:checked ~ .layout .sidebar-footer {
      padding: 16px 0;
    }

    #sidebar-toggle:checked ~ .layout .account-button {
      justify-content: center;
      padding: 5px 0;
    }

    #sidebar-toggle:checked ~ .layout .account-menu {
      right: auto;
      bottom: 0;
      left: calc(100% + 8px);
      width: 150px;
    }

    @media (max-width: 700px) {
      .layout {
        flex-direction: row;
      }

      .layout > .sidebar {
        width: 220px;
        flex-basis: 220px;
      }

      #sidebar-toggle:checked ~ .layout > .sidebar {
        display: flex;
        width: 54px;
        flex-basis: 54px;
      }
    }
  </style>
</head>

<body>
  <input
    type="checkbox"
    id="sidebar-toggle"
    class="sidebar-toggle"
  >

  <div class="layout">
    <aside class="sidebar">
      <div>
        <div class="sidebar-heading">
          <p class="sidebar-label">NOTIFY</p>

          <label
            for="sidebar-toggle"
            class="sidebar-icon-button"
            aria-label="Toggle sidebar"
            title="Toggle sidebar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="2"
              ></rect>

              <path d="M9 3v18"></path>
            </svg>
          </label>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a href="Dashboard.html">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>

            <span>Dashboard</span>
          </a>

          <a href="Notification.html">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
              ></path>

              <path d="M10 21h4"></path>
            </svg>

            <span>Send Notification</span>
          </a>

          <a
            href="History.html"
            class="active"
            aria-current="page"
          >
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7"></path>
              <path d="M3 4v5h5"></path>
              <path d="M12 7v5l3 2"></path>
            </svg>

            <span>History</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div
          id="account-menu"
          class="account-menu"
          role="menu"
          hidden
        >
          <button
            type="button"
            id="sign-out-button"
            class="popup-signout-button"
            role="menuitem"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path
                d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"
              ></path>
            </svg>

            <span>Sign out</span>
          </button>
        </div>

        <button
          type="button"
          id="account-button"
          class="account-button"
          aria-label="Open account menu"
          aria-controls="account-menu"
          aria-expanded="false"
        >
          <span class="account-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
          </span>

          <span id="username-display" class="account-name">
            Username
          </span>
        </button>
      </div>
    </aside>

    <main>
      <div class="content">
        <div class="page-heading">
          <h1>Notification history</h1>

          <p class="subtitle">
            Search and review your recent notification deliveries.
          </p>
        </div>

        <div class="search-panel">
          <label class="visually-hidden" for="history-search">
            Search notification history
          </label>

          <input
            id="history-search"
            class="search-input"
            type="search"
            placeholder="Search by ID, channel, or destination"
          >

          <label class="visually-hidden" for="status-filter">
            Filter by status
          </label>

          <select id="status-filter" class="status-filter">
            <option value="all">Filter by status</option>
            <option value="delivered">Delivered</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
          </select>

          <label class="visually-hidden" for="time-filter">
            Filter by time
          </label>

          <select id="time-filter" class="status-filter">
            <option value="all">Filter by time</option>
            <option value="today">Today</option>
            <option value="week">Last 7 days</option>
            <option value="month">Last 30 days</option>
          </select>
        </div>

        <div class="history-card">
          <table>
            <caption class="visually-hidden">
              Notification delivery history
            </caption>

            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Channel</th>
                <th scope="col">Destination</th>
                <th scope="col">Status</th>
                <th scope="col">Attempts</th>
                <th scope="col">Time</th>
              </tr>
            </thead>

            <tbody id="history-records">
              <tr>
                <td colspan="6" class="table-empty">
                  Loading...
                </td>
              </tr>
            </tbody>
          </table>

          <p id="empty-state" class="empty-state">
            No notification records match your search.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./common.js"></script>

  <script>
    const accountButton =
      document.querySelector("#account-button");

    const accountMenu =
      document.querySelector("#account-menu");

    const signOutButton =
      document.querySelector("#sign-out-button");

    const usernameDisplay =
      document.querySelector("#username-display");

    const savedUsername =
      localStorage.getItem("notify_username");

    usernameDisplay.textContent =
      savedUsername || "Username";

    accountButton.addEventListener("click", (event) => {
      event.stopPropagation();

      const menuIsOpen = !accountMenu.hidden;

      accountMenu.hidden = menuIsOpen;

      accountButton.setAttribute(
        "aria-expanded",
        String(!menuIsOpen)
      );
    });

    signOutButton.addEventListener("click", () => {
      localStorage.removeItem("notify_username");
      localStorage.removeItem("notify_email");

      window.location.href = "Login.html";
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".sidebar-footer")) {
        accountMenu.hidden = true;

        accountButton.setAttribute(
          "aria-expanded",
          "false"
        );
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        accountMenu.hidden = true;

        accountButton.setAttribute(
          "aria-expanded",
          "false"
        );
      }
    });

    (function () {
      const tbody =
        document.querySelector("#history-records");

      const searchInput =
        document.querySelector("#history-search");

      const statusFilter =
        document.querySelector("#status-filter");

      const timeFilter =
        document.querySelector("#time-filter");

      const emptyState =
        document.querySelector("#empty-state");

      let debounceHandle = null;
      let lastNotifications = [];

      const FILTER_STATUSES = {
        delivered: ["SENT", "DELIVERED"],
        pending: ["PENDING"],
        failed: ["FAILED"]
      };

      const TIME_WINDOW_MS = {
        today: 24 * 60 * 60 * 1000,
        week: 7 * 24 * 60 * 60 * 1000,
        month: 30 * 24 * 60 * 60 * 1000
      };

      function withinTimeFilter(isoString) {
        const windowMs =
          TIME_WINDOW_MS[timeFilter.value];

        if (!windowMs) {
          return true;
        }

        const hasTimezone =
          /Z$|[+-]\d{2}:?\d{2}$/.test(isoString || "");

        const created = new Date(
          hasTimezone
            ? isoString
            : (isoString || "") + "Z"
        );

        if (Number.isNaN(created.getTime())) {
          return true;
        }

        return Date.now() - created.getTime() <= windowMs;
      }

      function renderRows(notifications) {
        const selectedStatus = statusFilter.value;

        const allowedStatuses =
          FILTER_STATUSES[selectedStatus];

        const rows = [];

        notifications.forEach((notification) => {
          const shortId =
            notification.id.slice(0, 8);

          (notification.deliveries || []).forEach(
            (delivery) => {
              const deliveryStatus =
                (delivery.status || "").toUpperCase();

              if (
                allowedStatuses &&
                !allowedStatuses.includes(deliveryStatus)
              ) {
                return;
              }

              if (!withinTimeFilter(delivery.created_at)) {
                return;
              }

              rows.push(`
                <tr>
                  <td class="notification-id">
                    ${NotificationUi.escapeHtml(shortId)}
                  </td>

                  <td>
                    ${NotificationUi.escapeHtml(
                      delivery.channel
                    )}
                  </td>

                  <td>
                    ${NotificationUi.escapeHtml(
                      delivery.destination
                    )}
                  </td>

                  <td>
                    <span
                      class="status ${NotificationUi.statusClass(
                        delivery.status
                      )}"
                    >
                      ${NotificationUi.statusLabel(
                        delivery.status
                      )}
                    </span>
                  </td>

                  <td>
                    ${delivery.retry_count + 1}
                  </td>

                  <td>
                    ${NotificationUi.formatTime(
                      delivery.created_at
                    )}
                  </td>
                </tr>
              `);
            }
          );
        });

        tbody.innerHTML =
          rows.length ? rows.join("") : "";

        emptyState.classList.toggle(
          "visible",
          rows.length === 0
        );
      }

      async function load() {
        const params = {
          q: searchInput.value.trim() || undefined,
          limit: 100
        };

        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="table-empty">
              Loading...
            </td>
          </tr>
        `;

        emptyState.classList.remove("visible");

        try {
          const result =
            await NotificationApi.listNotifications(params);

          lastNotifications = result.items;
          renderRows(lastNotifications);
        } catch (error) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="table-error">
                ${NotificationUi.escapeHtml(error.message)}
              </td>
            </tr>
          `;
        }
      }

      searchInput.addEventListener("input", () => {
        clearTimeout(debounceHandle);
        debounceHandle = setTimeout(load, 300);
      });

      statusFilter.addEventListener("change", () => {
        renderRows(lastNotifications);
      });

      timeFilter.addEventListener("change", () => {
        renderRows(lastNotifications);
      });

      load();
    })();
  </script>
</body>
</html>
