server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # No index.html in this app (pages are Login.html, Dashboard.html,
    # Notification.html, History.html) - serve Login.html at "/" instead
    # of falling through to nginx's own default welcome page.
    index Login.html;

    location / {
        try_files $uri $uri/ /Login.html;
    }
}
